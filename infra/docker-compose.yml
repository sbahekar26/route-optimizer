services:
  stops-db:
    image: postgres:18       # pin a major version — look up current stable
    environment:
      POSTGRES_USER: stops
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: stopsdb
    ports:
      - "5432:5432"
    volumes:
      - stops-db-data:/var/lib/postgresql
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"     # AMQP — apps connect here
      - "15672:15672"   # management web UI — you browse here
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/ontario-latest.osrm
    ports:
      - "5050:5000"
    volumes:
      - ./osrm/data:/data

volumes:
  stops-db-data: