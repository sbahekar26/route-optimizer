<svg width="880" height="620" viewBox="0 0 880 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#111111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { fill: #111111; }
    .svc  { fill: #ffffff; stroke: #111111; stroke-width: 1.6; }
    .store{ fill: #ffffff; stroke: #111111; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .name { font-size: 15px; font-weight: 600; }
    .sub  { font-size: 11.5px; fill: #444444; }
    .lbl  { font-size: 11.5px; fill: #111111; }
    .num  { font-size: 11px; font-weight: 700; fill: #111111; }
    .solid{ stroke: #111111; stroke-width: 1.6; fill: none; }
    .dash { stroke: #111111; stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; }
  </style>

  <rect x="0" y="0" width="880" height="620" fill="#ffffff"/>

  <text x="40" y="46" font-size="20" font-weight="700">Route Optimizer &#8212; architecture</text>
  <text x="40" y="70" class="sub" font-size="12.5">Asynchronous job processing. The client submits a job and polls for the result; the two services never call each other directly.</text>

  <!-- TOP ROW: request/result flow -->
  <rect x="40"  y="110" width="150" height="66" class="svc"/>
  <text x="115" y="138" text-anchor="middle" class="name">Client</text>
  <text x="115" y="158" text-anchor="middle" class="sub">POST / GET</text>

  <rect x="270" y="110" width="180" height="66" class="svc"/>
  <text x="360" y="138" text-anchor="middle" class="name">Stops API</text>
  <text x="360" y="158" text-anchor="middle" class="sub">ASP.NET Core</text>

  <rect x="530" y="110" width="150" height="66" class="svc"/>
  <text x="605" y="138" text-anchor="middle" class="name">RabbitMQ</text>
  <text x="605" y="158" text-anchor="middle" class="sub">broker</text>

  <rect x="720" y="110" width="130" height="66" class="svc"/>
  <text x="785" y="138" text-anchor="middle" class="name">Solver</text>
  <text x="785" y="158" text-anchor="middle" class="sub">worker</text>

  <!-- BOTTOM ROW: dependencies under owners -->
  <rect x="270" y="380" width="180" height="66" class="store"/>
  <text x="360" y="408" text-anchor="middle" class="name">PostgreSQL</text>
  <text x="360" y="428" text-anchor="middle" class="sub">stops &#183; results</text>

  <rect x="720" y="380" width="130" height="66" class="store"/>
  <text x="785" y="408" text-anchor="middle" class="name">OSRM</text>
  <text x="785" y="428" text-anchor="middle" class="sub">drive-times</text>

  <!-- TOP-ROW EDGES -->
  <line x1="190" y1="143" x2="262" y2="143" class="solid" marker-end="url(#arrow)"/>
  <line x1="262" y1="160" x2="190" y2="160" class="solid" marker-end="url(#arrow)"/>

  <line x1="450" y1="136" x2="522" y2="136" class="solid" marker-end="url(#arrow)"/>
  <text x="486" y="126" text-anchor="middle" class="lbl">request</text>
  <line x1="522" y1="160" x2="450" y2="160" class="dash" marker-end="url(#arrow)"/>
  <text x="486" y="176" text-anchor="middle" class="lbl">result</text>

  <line x1="680" y1="136" x2="712" y2="136" class="solid" marker-end="url(#arrow)"/>
  <line x1="712" y1="160" x2="680" y2="160" class="dash" marker-end="url(#arrow)"/>

  <!-- VERTICAL EDGES to dependencies -->
  <line x1="360" y1="176" x2="360" y2="374" class="solid" marker-end="url(#arrow)"/>
  <text x="372" y="280" class="lbl">read stops /</text>
  <text x="372" y="296" class="lbl">store result</text>

  <line x1="785" y1="176" x2="785" y2="374" class="solid" marker-end="url(#arrow)"/>
  <text x="797" y="288" class="lbl">/table</text>

  <!-- STEP NUMBERS -->
  <circle cx="228" cy="143" r="9" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="228" y="147" text-anchor="middle" class="num">1</text>

  <!-- LEGEND -->
  <line x1="40" y1="500" x2="840" y2="500" stroke="#111111" stroke-width="1"/>

  <line x1="40" y1="524" x2="76" y2="524" class="solid"/>
  <text x="84" y="528" class="sub">synchronous / read-write</text>

  <line x1="260" y1="524" x2="296" y2="524" class="dash"/>
  <text x="304" y="528" class="sub">asynchronous message</text>

  <rect x="500" y="516" width="30" height="16" class="store"/>
  <text x="538" y="528" class="sub">infrastructure dependency</text>

  <text x="40" y="560" class="sub">Flow: (1) client POSTs a job &#8594; (2) API stores stops, publishes a request &#8594; (3) Solver consumes it, queries OSRM, solves with OR-Tools &#8594;</text>
  <text x="40" y="578" class="sub">(4) Solver publishes the result &#8594; (5) API consumes and stores it &#8594; (6) client retrieves the route via GET /optimize/&#123;jobId&#125;.</text>
  <text x="40" y="600" class="sub">The services share only a message-contract library &#8212; no shared database, no shared logic.</text>
</svg>
